services:
  db:
    image: postgres:16-alpine
    container_name: homepulse-db
    environment:
      POSTGRES_USER: homepulse
      POSTGRES_PASSWORD: homepulse_secret
      POSTGRES_DB: homepulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homepulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: homepulse-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homepulse-backend
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: homepulse
      POSTGRES_PASSWORD: homepulse_secret
      POSTGRES_DB: homepulse
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: super-secret-key-change-me-in-production-32chars-min
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: homepulse-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
